# generated by `gitident import` — review, rename profiles, then run with --write
# precedence: later rules win; a profile's repos beat all rules
version: 1
strict_identity: true
profiles:
  # source: includeIf "gitdir:~/work/" → ~/.gitconfig-work
  # source: includeIf "hasconfig:remote.*.url:git@github.com:acme/**" → ~/.gitconfig-work
  # source: includeIf "onbranch:release" → ~/.gitconfig-work
  # source: GitKraken profile "Work Laptop"
  # source: local config of ~/work/redundant
  work:
    name: Kirill Kunst
    email: kirill@acme.com
    signing_key: ~/.ssh/id_acme.pub
    gpg_format: ssh
    gpgsign: true
    ssh_key: ~/.ssh/id_acme
    extra:
      pull.rebase: "true"
  # source: includeIf "gitdir:~/oss/lib/.git" → ~/.gitconfig.d/oss.inc
  # source: includeIf "hasconfig:remote.*.url:https://github.com/me/notes" → ~/.gitconfig.d/oss.inc
  oss:
    name: Kirill K
    email: k@oss.dev
    repos:
      - ~/oss/lib
      - https://github.com/me/notes
  # source: global identity in ~/.gitconfig
  # source: GitKraken profile "Home"
  home:
    name: Kirill Kunst
    email: kirill@personal.dev
  # source: local config of ~/code/a
  # source: local config of ~/code/b
  # source: local config of ~/code/c
  freelance:
    name: Kirill Freelance
    email: k@freelance.io
    repos:
      - ~/code/a
      - ~/code/b
      - ~/code/c
  # source: local config of ~/code/pinned
  client:
    name: Kirill
    email: kirill@client.example
    repos:
      - ~/code/pinned
  # source: local config of ~/work/side
  personal:
    name: Kirill Kunst
    email: kirill@personal.dev
    signing_key: ~/.ssh/id_acme.pub
    gpg_format: ssh
    gpgsign: true
    ssh_key: ~/.ssh/id_acme
    repos:
      - ~/work/side
rules:
  - profile: work
    dirs:
      - ~/work
    remotes:
      - git@github.com:acme/**
